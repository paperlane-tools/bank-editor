name: Release Bank Editor

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests (non-GUI)
        run: python -c "import test_bank_core as t; [f() for f in t.TESTS if not f.__name__.startswith('test_gui')]"

      - name: Package
        shell: pwsh
        run: |
          $name = "bank-editor-${{ github.ref_name }}.zip"
          Compress-Archive -Path *.py, *.bat, *.md, LICENSE -DestinationPath $name
          Get-Item $name | Select-Object Name, Length

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: bank-editor-*.zip
